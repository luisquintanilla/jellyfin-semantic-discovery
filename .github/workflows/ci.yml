name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 11.0.100

      - name: Restore
        shell: pwsh
        run: |
          dotnet tool restore --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore Jellyfin.SemanticDiscovery.slnx --configfile NuGet.Config --locked-mode

      - name: Validate PowerShell scripts
        shell: pwsh
        run: ./scripts/Test-PowerShellSyntax.ps1

      - name: Build
        run: dotnet build Jellyfin.SemanticDiscovery.slnx --no-restore

      - name: Unit tests
        run: dotnet test tests/Jellyfin.SemanticDiscovery.Tests --no-build --no-restore

      # Qdrant, Ollama (embeddings), the semantic service, Jellyfin and the plugin, run by the AppHost.
      # No chat model in CI: books are read from their text layer.
      - name: Aspire end-to-end
        shell: pwsh
        run: ./scripts/Test-EndToEnd.ps1 -Profile ci -NuGetConfig NuGet.Config